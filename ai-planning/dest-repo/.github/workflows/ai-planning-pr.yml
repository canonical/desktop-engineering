# Installed/updated by `setup-dest-repo.sh`
name: AI planning event dispatch

on:
  pull_request:
    types:
      [opened, edited, reopened, converted_to_draft, ready_for_review, closed]
  issues:
    types: [opened, edited, closed, reopened]

permissions: {}

jobs:
  dispatch-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relay this PR's facts to the planning repo
        uses: canonical/desktop-engineering/gh-actions/ai-planning/pr-dispatch@ai_planning_board
        with:
          planning-repo: <org>/<planning-repo>
          dispatch-token: ${{ secrets.AI_PLANNING_DISPATCH_TOKEN }}
  dispatch-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relay this issue lifecycle event to the planning repo
        uses: canonical/desktop-engineering/gh-actions/ai-planning/issue-dispatch@ai_planning_board
        with:
          planning-repo: <org>/<planning-repo>
          dispatch-token: ${{ secrets.AI_PLANNING_DISPATCH_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          issue-action: ${{ github.event.action }}
          issue-state: ${{ github.event.issue.state }}

# Installed/updated by `ai-planning/setup-dest-board.sh`
name: AI planning board sync

# Event-driven only — every trigger is a fact the sweep can reconcile, and
# there is no timer: issue lifecycle events, PR events (open, push, draft
# flips, close), review submissions and completed check suites in THIS repo
# settle the board within about a minute. Run it by hand (Actions → Run
# workflow) after a change that raises no event, such as editing a view.
#
# The board is the org Project titled `AI planning` linked to this repo, found
# by the action itself — no variables, no boards JSON. The one secret is the
# PAT Projects v2 requires: GITHUB_TOKEN cannot resolve a ProjectV2 at all
# (verified live), even for a repo-linked board.

concurrency:
  group: ai-planning-board-sync
  cancel-in-progress: true

on:
  issues:
    types:
      [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  pull_request:
    types:
      [opened, edited, reopened, synchronize, converted_to_draft, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed]
  # check_suite does NOT fire for suites GitHub Actions itself created (GitHub
  # suppresses it to prevent recursion), so a repo whose CI runs on Actions
  # would never sweep on a red→green flip through it. workflow_run fires for
  # any completed workflow run on the default branch — the repo's CI included —
  # and the job's guard below excludes this workflow's own runs so the sync
  # never triggers itself.
  workflow_run:
    types: [completed]
  workflow_dispatch: {}

# The job itself needs no token at all — the action carries its own PAT input.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A workflow_run event for THIS workflow's own run must not re-sweep
    # (every run completes, which would otherwise loop forever).
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.name != 'AI planning board sync'
    steps:
      - name: Reconcile the AI planning board
        uses: canonical/desktop-engineering/gh-actions/ai-planning/repo-board-sync@ai_planning_repo_board
        with:
          token: ${{ secrets.AI_PLANNING_TOKEN }}

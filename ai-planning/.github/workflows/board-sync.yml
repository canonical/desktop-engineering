# Sync the planning repo's tickets with the board status of every board (the
# `all` board and one per squad).
#
# Automated triggers:
# * any `issues` event here settles the whole board;
# * PR and issue lifecycle events from destination repos dispatch straight
#   to this repo (a single job POSTs `repository_dispatch`);
# * a 4-hourly `schedule` sweep catches what raises no event, such as a Map
#   card archived or restored in the Project UI.
name: AI planning board status sync

concurrency:
  group: ai-planning-board-sync
  cancel-in-progress: true

on:
  issues:
    types:
      [
        opened,
        closed,
        reopened,
        assigned,
        unassigned,
        labeled,
        unlabeled,
        edited,
      ]
  repository_dispatch:
    types: [ai-planning-pr, ai-planning-issue]
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile the planning board
        uses: canonical/desktop-engineering/gh-actions/ai-planning/sync@ai_planning_board
        with:
          boards: ${{ vars.AI_PLANNING_BOARDS }}
          token: ${{ secrets.AI_PLANNING_TOKEN }}
          # Forwarded only for PR dispatches: the immediate arm authors this
          # one PR's link before the same sweep scores it. Issue dispatches and
          # all other triggers pass '' and run only the reconcile sweep.
          dispatched-pr: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'ai-planning-pr' && toJSON(github.event.client_payload) || '' }}

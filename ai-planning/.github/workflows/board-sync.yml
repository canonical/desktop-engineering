# Sync the repo planning repo tickets with the board status.
# Keep the three triggers on one caller: the reconcile is a full-board sweep, so any issues event settles the
# whole board, and schedule is just a short floor for when the repo is silent.
#
# The prompt path for a code-repo PR merge is `gh workflow run board-sync.yml --repo <planning-repo>` at merge
# time (GitHub sends the planning repo no signal for a merge in another repo). The 10-minute `schedule` is only
# the quiescence floor for when that dispatch is missed — a merged spec-branch ticket then settles on the next
# floor sweep rather than instantly.

name: AI planning board status sync

# One global concurrency group: the sweep is a full-board reconcile, so a burst of
# triggers (several issue events in quick succession, plus the schedule) needs no
# more than the one in flight — `cancel-in-progress` collapses the burst to a
# single run instead of queuing/serialising redundant sweeps of the same board.
concurrency:
  group: ai-planning-board-sync
  cancel-in-progress: true

on:
  issues:
    types:
      [
        opened,
        closed,
        reopened,
        assigned,
        unassigned,
        labeled,
        unlabeled,
        edited,
      ]
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

jobs:
  sync:
    uses: canonical/desktop-engineering/gh-actions/ai-planning/board-sync.yaml@main
    with:
      project-id: ${{ vars.AI_PLANNING_PROJECT_ID }}
    secrets:
      token: ${{ secrets.AI_PLANNING_TOKEN }}

# Sync the planning repo's tickets with the board status.
#
# Two automated triggers:
# * any `issues` event here settles the whole board;
# * any impacting PR event from the destination repo dispatches straight
# to this repo (a single job POSTs `repository_dispatch`)
name: AI planning board status sync

concurrency:
  group: ai-planning-board-sync
  cancel-in-progress: true

on:
  issues:
    types:
      [
        opened,
        closed,
        reopened,
        assigned,
        unassigned,
        labeled,
        unlabeled,
        edited,
      ]
  repository_dispatch:
    types: [ai-planning-pr]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile the planning board
        uses: canonical/desktop-engineering/gh-actions/ai-planning/sync@ai_planning_board
        with:
          project-id: ${{ vars.AI_PLANNING_PROJECT_ID }}
          token: ${{ secrets.AI_PLANNING_TOKEN }}
          # Forwarded only on the dispatch trigger: the immediate arm authors
          # this one PR's link before the same sweep scores it. Every other
          # trigger passes '' (falsy in Python — see ai_planning.__main__),
          # running exactly the reconcile sweep it always has.
          dispatched-pr: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || '' }}

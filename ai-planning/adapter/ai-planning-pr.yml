# AI planning PR dispatch — per-repo caller (ticket 35).
#
# Installed/updated by `onboard-code-repo.sh` (never hand-edited in place: a
# re-run of the installer is what keeps this in sync with the template).
# Non-required, cosmetic check: the real work — authoring the PR's link and
# scoring its card — runs in the planning repo, dispatched to by this job.
name: AI planning PR dispatch

on:
  pull_request:
    types:
      [opened, edited, reopened, converted_to_draft, ready_for_review, closed]

permissions: {}

jobs:
  dispatch:
    uses: canonical/desktop-engineering/.github/workflows/ai-planning-pr-dispatch.yaml@ai_planning_board
    with:
      planning-repo: <org>/<planning-repo>
    secrets:
      dispatch-token: ${{ secrets.AI_PLANNING_DISPATCH_TOKEN }}

name: Comprehensive Melos actions

on:
  workflow_call:
    inputs:
      os:
        description: OS to run on
        type: string
        default: ubuntu-latest

jobs:
  analyze:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./gh-actions/flutter/setup
      - run: melos generate
      - run: melos gen-l10n
      - run: melos analyze --fatal-infos

  format:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./gh-actions/flutter/setup
      - run: melos generate
      - run: melos gen-l10n
      - run: melos format:exclude

  l10n:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./gh-actions/flutter/setup
      - run: melos generate
      - run: melos gen-l10n

  test:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./gh-actions/flutter/setup
      - run: sudo apt update && sudo apt install -y lcov
      - run: melos generate
      - run: melos gen-l10n
      - run: melos coverage

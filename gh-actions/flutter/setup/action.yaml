name: Flutter setup
description: Sets up FVM, Flutter, and Melos where possible

outputs:
  fvm:
    description: True if the repo is using FVM for Flutter version management
    value: ${{ steps.detect-files.outputs.fvm }}
  melos:
    description: True if the repo is using Melos for monorepo management
    value: ${{ steps.detect-files.outputs.melos }}
  flutter-version:
    description: The Flutter version that was setup
    value: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}

inputs:
  flutter-version:
    description: The Flutter version to force (defaults to version determined by FVM)
    required: false
  fvm-version:
    description: The FVM version to install (defaults to latest)
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - name: Detect FVM and Melos
      id: detect-files
      shell: bash
      run: |
        if [[ -f "./.fvmrc" ]]; then
          echo "FVM detected"
          echo "fvm=true" >> "$GITHUB_OUTPUT"
        fi
        if [[ -f "./melos.yaml" ]]; then
          echo "Melos detected"
          echo "melos=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install FVM Flutter
      if: ${{ steps.detect-files.outputs.fvm == 'true' || inputs.flutter-version != '' }}
      shell: bash
      run: |
        if [[ -n "${{ inputs.fvm-version }}" ]]; then
          curl -fsSL https://fvm.app/install.sh | bash -s -- "${{ inputs.fvm-version }}"
        else
          curl -fsSL https://fvm.app/install.sh | bash
        fi

        export PATH="$HOME/fvm/bin:$PATH"
        echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
        fvm --version

        if [[ "${{ inputs.flutter-version }}" ]]; then
          echo "Forcing use of Flutter v${{ inputs.flutter-version }}"
          fvm use "${{ inputs.flutter-version }}"
        fi

        fvm install

    - uses: kuhnroyal/flutter-fvm-config-action@v3
      id: fvm-config-action
      if: ${{ steps.detect-files.outputs.fvm == 'true' }}

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION || inputs.flutter-version }}
        channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}

    - name: Install Melos
      if: ${{ steps.detect-files.outputs.melos == 'true' }}
      shell: bash
      run: |
        # Parse the locked melos version from pubspec.lock: under the
        # top-level "  melos:" package key, the first nested version field
        if [[ -f "./pubspec.lock" ]]; then
          VERSION=$(awk '/^  melos:/{f=1} f && /^    version:/{gsub(/"/, "", $2); print $2; exit}' pubspec.lock)
        fi
        if [[ -z "$VERSION" ]]; then
          echo "::error::No melos entry found in pubspec.lock."
          echo "::error::Add melos to dev_dependencies and commit pubspec.lock."
          exit 1
        fi
        echo "Using melos $VERSION locked in pubspec.lock"

        dart pub global activate melos "$VERSION"
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        dart pub global run melos bootstrap

    - name: Flutter Doctor
      shell: bash
      run: |
        flutter doctor --verbose

    - name: FVM Flutter Doctor
      if: ${{ steps.detect-files.outputs.fvm == 'true' || inputs.flutter-version != '' }}
      shell: bash
      run: |
        fvm flutter doctor --verbose

# Relay a destination-repo issue lifecycle event to its planning repo. The
# planning repo owns the only privileged token and runs the full board reconcile.
name: AI planning issue dispatch
description: >-
  Relay one destination-repo issue lifecycle event to its planning repo as a
  repository_dispatch, triggering a full board reconcile.

inputs:
  planning-repo:
    description: The planning repo (owner/name) to dispatch to.
    required: true
  dispatch-token:
    description: >-
      Fine-grained PAT scoped to the planning repo, Contents: Read and write.
    required: true
  event-type:
    description: The repository_dispatch event type listened for by board-sync.yml.
    required: false
    default: ai-planning-issue
  issue-number:
    description: The issue number that triggered this workflow.
    required: true
  issue-action:
    description: The GitHub issue event action (opened, edited, closed, reopened).
    required: true
  issue-state:
    description: The issue state reported by GitHub (open or closed).
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch this issue event to the planning repo
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.dispatch-token }}
        PLANNING_REPO: ${{ inputs.planning-repo }}
        EVENT_TYPE: ${{ inputs.event-type }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        ISSUE_ACTION: ${{ inputs.issue-action }}
        ISSUE_STATE: ${{ inputs.issue-state }}
      run: |
        set -euo pipefail

        if [ -z "$PLANNING_REPO" ] || [ "$PLANNING_REPO" != "${PLANNING_REPO#*<}" ]; then
          echo "::error::planning-repo is unset or still the '<org>/<planning-repo>' placeholder ('$PLANNING_REPO'). Re-run ai-planning/setup-dest-repo.sh (or set with.planning-repo to the real owner/name)." >&2
          exit 1
        fi
        if [[ ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "::error::issue-number is missing or invalid ('$ISSUE_NUMBER')." >&2
          exit 1
        fi

        jq -n \
          --arg owner "$REPO_OWNER" \
          --arg name "$REPO_NAME" \
          --arg action "$ISSUE_ACTION" \
          --arg state "$ISSUE_STATE" \
          --argjson number "$ISSUE_NUMBER" \
          '{
            event_type: env.EVENT_TYPE,
            client_payload: {
              repository: {owner: $owner, name: $name},
              number: $number,
              action: $action,
              state: $state
            }
          }' \
        | gh api --method POST "repos/$PLANNING_REPO/dispatches" --input -

# Composite action that reconciles the AI planning boards' Status column from
# live GitHub facts, and archives or restores closed Maps and their trees. The
# planning repo feeds several boards (an `all` board plus one per squad), all
# swept in one run. It is one of the sibling
# composite actions under `gh-actions/ai-planning/` — this one (`sync/`) settles
# the board; `pr-dispatch/` relays PR facts and `issue-dispatch/` relays issue
# lifecycle events. All are actions rather than reusable
# workflows on purpose: an action can be referenced from any directory as
# `canonical/desktop-engineering/gh-actions/ai-planning/sync@<ref>`, whereas a
# reusable workflow is forced to live at the repo-root `.github/workflows/`.
#
# It runs one idempotent full-board reconcile: reads every Project card's live
# GitHub facts (issue / PR / dependency state, cross-repo, over a fine-grained PAT)
# and sets each card's Status from scratch. The `ai_planning` package it drives
# lives at `../../../ai-planning`. See ../README.md.
name: AI planning board status sync
description: >-
  Idempotent full reconcile of every AI planning board's Status column
  (and archiving/restoring closed Maps with their trees), driven by ai_planning in
  canonical/desktop-engineering.

inputs:
  boards:
    description: >-
      JSON object mapping each board slug to its org Project (v2) node id
      (PVT_...), e.g. {"all": "PVT_...", "apps": "PVT_..."}. `all` carries every
      planning issue; any other slug carries the issues labelled `squad:<slug>`.
    required: true
  token:
    description: Fine-grained PAT (Issues:read, PRs:read, org Projects:write).
    required: true
  ref:
    description: Ref of canonical/desktop-engineering providing the ai_planning package.
    required: false
    default: ai_planning_board
  dispatched-pr:
    description: >-
      JSON `repository_dispatch` client_payload (ticket 35), passed through
      verbatim when the caller ran from `on: repository_dispatch`. Empty on
      every other trigger, in which case the sweep runs exactly as before.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check out the ai_planning tooling
      uses: actions/checkout@v4
      with:
        repository: canonical/desktop-engineering
        ref: ${{ inputs.ref }}
        sparse-checkout: ai-planning
        path: desktop-engineering-ai-planning

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install the ai_planning package
      shell: bash
      run: python -m pip install ./desktop-engineering-ai-planning/ai-planning

    - name: Run the reconcile sweep
      shell: bash
      env:
        AI_PLANNING_TOKEN: ${{ inputs.token }}
        AI_PLANNING_BOARDS: ${{ inputs.boards }}
        # The caller repo IS the planning repo; passing it seeds its issues (and
        # their sub-issue children) onto each board.
        AI_PLANNING_REPO: ${{ github.repository }}
        # Forwarded verbatim to the immediate authoring arm; empty is falsy in
        # Python, so an empty string here is the same as the variable being
        # unset (see ai_planning.__main__).
        AI_PLANNING_DISPATCHED_PR: ${{ inputs.dispatched-pr }}
      run: python -m ai_planning

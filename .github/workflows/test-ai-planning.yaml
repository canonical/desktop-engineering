name: Test the ai-planning board sync
on:
  push:
    branches:
      - main
    paths:
      - ai-planning/**
      - .github/workflows/test-ai-planning.yaml
  pull_request:
    paths:
      - ai-planning/**
      - .github/workflows/test-ai-planning.yaml

jobs:
  test-ai-planning:
    name: pytest
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        working-directory: ai-planning
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package with dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run the test suite
        run: python -m pytest
